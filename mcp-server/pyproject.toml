[project]
name = "callgraph-mcp-server"
version = "1.2.0"
description = "MCP Server bridging Cursor to IntelliJ IDEA Call Graph plugin"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.scripts]
callgraph-mcp-server = "callgraph_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
